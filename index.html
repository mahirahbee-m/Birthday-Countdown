<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating & Bursting Emojis -->
  <div class="emoji-bg">
    <span class="emoji e1">💖</span>
    <span class="emoji e2">🦇</span>
    <span class="emoji e3">💋</span>
    <span class="emoji e4">💓</span>
    <span class="emoji e5">🏎️</span>
    <span class="emoji e6">💋</span>
    <span class="emoji e7">🦇</span>
    <span class="emoji e8">💖</span>
    <span class="emoji e9">💋</span>
    <span class="emoji e10">💕</span>
    <span class="emoji e11">🦇</span>
    <span class="emoji e12">🏎️</span>
  </div>

  <div class="card">
    <div class="checkered-banner top-left">🏁</div>
    <div class="checkered-banner bottom-right">🏁</div>

    <div id="countdown-box">
      <h1>🏎️ 💖 Counting down to your Birthday, Batman! 💖 🦇</h1>
      <div id="timer">
        <div class="time-unit"><span id="days">00</span><p>Days</p></div>
        <div class="time-unit"><span id="hours">00</span><p>Hours</p></div>
        <div class="time-unit"><span id="minutes">00</span><p>Minutes</p></div>
        <div class="time-unit"><span id="seconds">00</span><p>Seconds</p></div>
      </div>
    </div>

    <div id="birthday-message" class="hidden">
      <h1>🎉 Happy Birthday to my Batman! 🦇💋</h1>
      <p>Hope your day is as amazing as you are my love!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
